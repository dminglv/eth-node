version: "3.8"

services:
  geth:
    image: ethereum/client-go:stable
    container_name: eth-execution
    stop_signal: SIGINT
    stop_grace_period: 2m
    restart: unless-stopped
    ports:
      - "30303:30303"
      - "30303:30303/udp"
      - "18545:8545"
      - "18546:8546"
    volumes:
      - ./eth-data/execution:/root/.ethereum
      - ./jwt/jwt.hex:/jwt/jwt.hex:ro
    command:
      - --mainnet
      - --http
      - --http.addr=0.0.0.0
      - --http.api=eth,net,web3,debug
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.api=eth,net,web3,debug
      - --ws.origins=*
      - --syncmode=snap
      - --snapshot=true
      - --cache=4096
      - --authrpc.jwtsecret=/jwt/jwt.hex
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --db.engine=pebble
      - --metrics
      - --metrics.addr=0.0.0.0
      - --metrics.port=6060
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  lighthouse:
    image: sigp/lighthouse:latest
    container_name: eth-consensus
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 1m
    ports:
      - "9000:9000"
      - "9000:9000/udp"
    volumes:
      - ./eth-data/consensus:/root/.lighthouse
      - ./jwt/jwt.hex:/jwt/jwt.hex:ro
    command:
      - lighthouse
      - bn
      - --network=mainnet
      - --execution-endpoint=http://eth-execution:8551
      - --execution-jwt=/jwt/jwt.hex
      - --http
      - --http-address=0.0.0.0
      - --http-port=5052
      - --checkpoint-sync-url=${CC_CHECKPOINT_SYNC_URL}
      - --disable-deposit-contract-sync
      - --prune-payloads=true
      - --metrics
      - --metrics-address=0.0.0.0
      - --metrics-port=5054
    depends_on:
      - geth
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped
    depends_on:
      - lighthouse
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_LEVEL=warn
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"


volumes:
  prometheus-data:
    name: prometheus-data